<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 | About</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <Style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --secondary-color: #666666;
            --link-color: #111111;
            --hover-color: #555555;
            --spacing-unit: 24px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #111111;
                --text-color: #eeeeee;
                --secondary-color: #999999;
                --link-color: #eeeeee;
                --hover-color: #bbbbbb;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* Header / Hero */
        header {
            margin-bottom: 80px;
            padding-top: 40px;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .bio {
            font-size: 18px;
            color: var(--secondary-color);
            max-width: 600px;
            margin-bottom: 40px;
        }

        /* Layout Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 60px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        .header-title {
            font-size: 48px;
        }

        /* Sections */
        .section-title {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .item-list {
            list-style: none;
        }

        .item {
            margin-bottom: 24px;
            display: flex;
            align-items: baseline;
        }

        .item-year {
            font-family: monospace;
            color: var(--secondary-color);
            width: 60px;
            flex-shrink: 0;
            font-size: 14px;
        }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-weight: 500;
            display: block;
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: 14px;
            color: var(--secondary-color);
        }

        /* Links */
        a {
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.2s;
            border-bottom: 1px solid transparent;
        }

        a:hover {
            opacity: 0.7;
        }
        
        .nav-link {
           display: block;
           margin-bottom: 12px; 
        }

        /* Floating interaction from reference */
        .interactive-corner {
            position: fixed;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            cursor: pointer;
            overflow: hidden;
            z-index: 100;
        }
        
        .corner-fold {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 40px 40px 0;
            border-color: transparent #333 transparent transparent; 
            opacity: 0.1;
            transition: all 0.3s ease;
        }
        
        .interactive-corner:hover .corner-fold {
            border-width: 0 50px 50px 0;
            opacity: 0.2;
        }

        /* Footer */
        footer {
            padding: 40px 24px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        
        @media (prefers-color-scheme: dark) {
            footer {
                border-top-color: rgba(255,255,255,0.05);
            }
        }

        .social-links {
            display: flex;
            gap: 20px;
        }
        
        .social-links a {
            font-size: 18px;
        }
        
        .back-link {
            font-size: 14px;
            color: var(--secondary-color);
        }

        .age-display {
            font-family: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 32px;
            font-weight: 300;
            color: var(--text-color);
            letter-spacing: -0.5px;
            margin-top: 8px;
            font-variant-numeric: tabular-nums;
        }

    </Style>
</head>
<body>
    
    <div class="interactive-corner" title="Home">
        <a href="index.html" style="display:block; width:100%; height:100%;">
            <div class="corner-fold"></div>
        </a>
    </div>

    <main>
        <header>
            <h1 class="header-title">你好，"我""是""洪达"。</h1>
            <p class="bio">
                法与禅修的爱好者，<br/>
                这里是我的个人主页，用于分享佛陀的法与律、禅师法谈、禅修经验、以及推荐相关书籍。<br/>
                愿正法久住。
            </p>
        </header>

        <div class="grid">
            <div class="right-col">
                <div class="section"></div>
                    <h1 class="section-title">逝者如斯夫</h1>
                    <div id="age-counter" class="age-display"></div>
                </div>

                <script>
                    (function() {
                        // Birthdate: 1980-05-25 10:00:00 (Local Time)
                        // Month is 0-indexed in JS Date constructor (0=Jan, 4=May)
                        const birthDate = new Date(1980, 4, 25, 10, 0, 0);
                        const element = document.getElementById('age-counter');
                        
                        function updateAge() {
                            const now = new Date();
                            const diff = now - birthDate;
                            // Year length: 365.242199 days (Tropical year for high precision) or 365.25
                            // Using standard Gregorian average year: 365.2425 days = 31556952000 ms
                            const age = diff / 31556952000;
                            element.textContent = age.toFixed(20);
                            requestAnimationFrame(updateAge);
                        }
                        
                        updateAge();
                    })();
                </script>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://github.com/dhammaisland" target="_blank"><i class="bi bi-github"></i></a>
            <a href="mailto:paccakkha@yahoo.com"><i class="bi bi-envelope-fill"></i></a>
        </div>
        <div class="lang-switch">
            <a href="index.html" class="back-link">返回首页</a>
        </div>
    </footer>

    <script src="space-background.js"></script>
</body>
</html>
