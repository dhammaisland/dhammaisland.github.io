<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 | About</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <Style>
        :root {
            --bg-color: transparent;
            --text-color: #eeeeee;
            --secondary-color: #999999;
            --link-color: #eeeeee;
            --hover-color: #ffffff;
            --spacing-unit: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #090a0f; /* Fallback color matching canvas */
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* Header / Hero */
        header {
            margin-bottom: 80px;
            padding-top: 40px;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .bio {
            font-size: 18px;
            color: var(--secondary-color);
            max-width: 600px;
            margin-bottom: 40px;
        }

        /* Layout Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 60px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        .header-title {
            font-size: 48px;
        }

        /* Sections */
        .section-title {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .item-list {
            list-style: none;
        }

        .item {
            margin-bottom: 24px;
            display: flex;
            align-items: baseline;
        }

        .item-year {
            font-family: monospace;
            color: var(--secondary-color);
            width: 60px;
            flex-shrink: 0;
            font-size: 14px;
        }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-weight: 500;
            display: block;
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: 14px;
            color: var(--secondary-color);
        }

        /* Links */
        a {
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.2s;
            border-bottom: 1px solid transparent;
        }

        a:hover {
            opacity: 0.7;
        }
        
        .nav-link {
           display: block;
           margin-bottom: 12px; 
        }

        /* Floating interaction from reference */
        .interactive-corner {
            position: fixed;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            cursor: pointer;
            overflow: hidden;
            z-index: 100;
        }
        
        .corner-fold {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 40px 40px 0;
            border-color: transparent #333 transparent transparent; 
            opacity: 0.1;
            transition: all 0.3s ease;
        }
        
        .interactive-corner:hover .corner-fold {
            border-width: 0 50px 50px 0;
            opacity: 0.2;
        }

        /* Footer */
        footer {
            padding: 40px 24px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        
        @media (prefers-color-scheme: dark) {
            footer {
                border-top-color: rgba(255,255,255,0.05);
            }
        }

        .social-links {
            display: flex;
            gap: 20px;
        }
        
        .social-links a {
            font-size: 18px;
        }
        
        .back-link {
            font-size: 14px;
            color: var(--secondary-color);
        }

        .age-display {
            font-family: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 32px;
            font-weight: 300;
            color: var(--text-color);
            letter-spacing: -0.5px;
            margin-top: 8px;
            font-variant-numeric: tabular-nums;
        }

        /* CRT Flicker Effect */
        .hello {
            display: inline-block;
            animation: crt-flicker 0.15s infinite;
            text-shadow: 
                2px 0 1px rgba(255,0,0,0.5),
                -2px 0 1px rgba(0,255,255,0.5);
            position: relative;
        }

        .hello::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @keyframes crt-flicker {
            0% { opacity: 0.27861; }
            5% { opacity: 0.34769; }
            10% { opacity: 0.23604; }
            15% { opacity: 0.90626; }
            20% { opacity: 0.18128; }
            25% { opacity: 0.83891; }
            30% { opacity: 0.65583; }
            35% { opacity: 0.57807; }
            40% { opacity: 0.26559; }
            45% { opacity: 0.84693; }
            50% { opacity: 0.96019; }
            55% { opacity: 0.08594; }
            60% { opacity: 0.20313; }
            65% { opacity: 0.71988; }
            70% { opacity: 0.34241; }
            75% { opacity: 0.93039; }
            80% { opacity: 0.55104; }
            85% { opacity: 0.87113; }
            90% { opacity: 0.42211; }
            95% { opacity: 0.13397; }
            100% { opacity: 0.35102; }
        }

    </Style>
</head>
<body>
    
    <div class="interactive-corner" title="Home">
        <a href="index.html" style="display:block; width:100%; height:100%;">
            <div class="corner-fold"></div>
        </a>
    </div>

    <main>
        <header>
            <h1 class="header-title"><p class="hello">你好，<br/>"我"是"洪达"。</p></h1>
            <p class="bio">
                法与禅修的爱好者，<br/>
                这里是我的个人主页，用于分享佛陀的法与律、禅师法谈、相关书籍等。<br/>
                愿正法久住。
            </p>
        </header>

        <div class="grid">
            <div class="right-col">
                <div class="section"></div>
                    <h1 class="section-title">逝者如斯夫</h1>
                    <div id="age-counter" class="age-display"></div>
                </div>

                <script>
                    (function() {
                        // Birthdate: 1980-05-25 10:00:00 (Local Time)
                        // Month is 0-indexed in JS Date constructor (0=Jan, 4=May)
                        const birthDate = new Date(1980, 4, 25, 10, 0, 0);
                        const element = document.getElementById('age-counter');
                        
                        function updateAge() {
                            const now = new Date();
                            const diff = now - birthDate;
                            // Year length: 365.242199 days (Tropical year for high precision) or 365.25
                            // Using standard Gregorian average year: 365.2425 days = 31556952000 ms
                            const age = diff / 31556952000;
                            element.textContent = age.toFixed(16);
                            requestAnimationFrame(updateAge);
                        }
                        
                        updateAge();
                    })();
                </script>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://github.com/dhammaisland" target="_blank"><i class="bi bi-github"></i></a>
            <a href="https://www.zhihu.com/people/paccakkha" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle;">
                    <path d="M5.721 0C2.251 0 0 2.25 0 5.719V18.28C0 21.751 2.252 24 5.721 24h12.56C21.751 24 24 21.75 24 18.281V5.72C24 2.249 21.75 0 18.281 0zm1.964 4.078c-.271.73-.5 1.434-.68 2.11h4.587c.545-.006.445 1.168.445 1.171H9.384a58.104 58.104 0 01-.112 3.797h2.712c.388.023.393 1.251.393 1.266H9.183a9.223 9.223 0 01-.408 2.102l.757-.604c.452.456 1.512 1.712 1.906 2.177.473.681.063 2.081.063 2.081l-2.794-3.382c-.653 2.518-1.845 3.607-1.845 3.607-.523.468-1.58.82-2.64.516 2.218-1.73 3.44-3.917 3.667-6.497H4.491c0-.015.197-1.243.806-1.266h2.71c.024-.32.086-3.254.086-3.797H6.598c-.136.406-.158.447-.268.753-.594 1.095-1.603 1.122-1.907 1.155.906-1.821 1.416-3.6 1.591-4.064.425-1.124 1.671-1.125 1.671-1.125zM13.078 6h6.377v11.33h-2.573l-2.184 1.373-.401-1.373h-1.219zm1.313 1.219v8.86h.623l.263.937 1.455-.938h1.456v-8.86z"/>
                </svg>
            </a>
            <a href="mailto:paccakkha@yahoo.com"><i class="bi bi-envelope-fill"></i></a>
        </div>
        <div class="lang-switch">
            <a href="index.html" class="back-link">返回首页</a>
        </div>
    </footer>

    <script src="space-background.js"></script>
</body>
</html>
