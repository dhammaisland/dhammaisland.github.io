<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言管理 | 法洲</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --dharma-brown: #8d5a2a;
            --dharma-light: #a67c52;
            --dharma-bg: #fdfbf7;
            --success-color: #059669;
            --danger-color: #dc2626;
            --warning-color: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--dharma-bg);
            min-height: 100vh;
            color: #1f2937;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--dharma-brown) 0%, var(--dharma-light) 100%);
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(141, 90, 42, 0.2);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left i {
            font-size: 28px;
        }

        .header-left h1 {
            font-size: 20px;
            font-weight: 500;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            font-size: 14px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-icon.total {
            background: rgba(141, 90, 42, 0.1);
            color: var(--dharma-brown);
        }

        .stat-icon.pending {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning-color);
        }

        .stat-icon.approved {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success-color);
        }

        .stat-icon.visits {
            background: rgba(37, 99, 235, 0.1);
            color: #2563eb;
        }

        .stat-icon.time {
            background: rgba(139, 92, 246, 0.1);
            color: #8b5cf6;
        }

        .stat-content h3 {
            font-size: 28px;
            font-weight: 600;
            color: #1f2937;
        }

        .stat-content p {
            font-size: 14px;
            color: #6b7280;
            margin-top: 4px;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 12px 24px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-tab:hover {
            border-color: var(--dharma-light);
        }

        .filter-tab.active {
            background: var(--dharma-brown);
            border-color: var(--dharma-brown);
            color: white;
        }

        .filter-tab .badge {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        .filter-tab.active .badge {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Messages List */
        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .message-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .message-card.pending {
            border-left-color: var(--warning-color);
        }

        .message-card.approved {
            border-left-color: var(--success-color);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .message-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--dharma-brown) 0%, var(--dharma-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .user-details h4 {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .user-details .meta {
            font-size: 13px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .user-details .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge.pending {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning-color);
        }

        .status-badge.approved {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success-color);
        }

        .message-content {
            font-size: 15px;
            line-height: 1.7;
            color: #374151;
            padding: 16px;
            background: #f9fafb;
            border-radius: 12px;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }

        .message-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
        }

        .action-btn.approve {
            background: var(--success-color);
            color: white;
        }

        .action-btn.approve:hover {
            background: #047857;
        }

        .action-btn.reject {
            background: #f3f4f6;
            color: #6b7280;
            border: 1px solid #e5e7eb;
        }

        .action-btn.reject:hover {
            background: #e5e7eb;
        }

        .action-btn.delete {
            background: #fef2f2;
            color: var(--danger-color);
            border: 1px solid #fecaca;
        }

        .action-btn.delete:hover {
            background: #fee2e2;
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #e5e7eb;
            border-top-color: var(--dharma-brown);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1f2937;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: var(--success-color);
        }

        .toast.error {
            background: var(--danger-color);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .header-right {
                width: 100%;
                justify-content: center;
            }

            .container {
                padding: 16px;
            }

            .message-header {
                flex-direction: column;
            }

            .message-actions {
                width: 100%;
            }

            .action-btn {
                flex: 1;
                justify-content: center;
            }
        }

        /* Dark Theme */
        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a1a;
                color: #e5e7eb;
            }

            .stat-card, .message-card {
                background: #2a2a2a;
            }

            .stat-content h3 {
                color: #e5e7eb;
            }

            .filter-tab {
                background: #2a2a2a;
                border-color: #404040;
                color: #9ca3af;
            }

            .filter-tab.active {
                background: var(--dharma-light);
                border-color: var(--dharma-light);
            }

            .message-content {
                background: #1f1f1f;
                color: #d1d5db;
            }

            .user-details h4 {
                color: #e5e7eb;
            }

            .action-btn.reject {
                background: #374151;
                border-color: #4b5563;
                color: #d1d5db;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <i class="bi bi-flower1"></i>
            <h1>留言管理</h1>
        </div>
        <div class="header-right">
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span id="userEmail">管理员</span>
            </div>
            <a href="dhammapada-list.html" class="nav-link">
                <i class="bi bi-journal-text"></i>
                <span>法句管理</span>
            </a>
            <a href="index.html" class="nav-link">
                <i class="bi bi-house"></i>
                <span>首页</span>
            </a>
            <button class="logout-btn" onclick="handleLogout()">
                <i class="bi bi-box-arrow-right"></i>
                <span>退出登录</span>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon total">
                    <i class="bi bi-chat-dots"></i>
                </div>
                <div class="stat-content">
                    <h3 id="totalCount">0</h3>
                    <p>总留言数</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon pending">
                    <i class="bi bi-hourglass-split"></i>
                </div>
                <div class="stat-content">
                    <h3 id="pendingCount">0</h3>
                    <p>待审核</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon approved">
                    <i class="bi bi-check-circle"></i>
                </div>
                <div class="stat-content">
                    <h3 id="approvedCount">0</h3>
                    <p>已通过</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon visits">
                    <i class="bi bi-eye"></i>
                </div>
                <div class="stat-content">
                    <h3 id="visitCount">--</h3>
                    <p>网站访问</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon time">
                    <i class="bi bi-clock-history"></i>
                </div>
                <div class="stat-content">
                    <h3 id="lastVisitTime" style="font-size: 18px;">--</h3>
                    <p>最后访问</p>
                </div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all" onclick="filterMessages('all')">
                <i class="bi bi-list-ul"></i>
                全部
                <span class="badge" id="allBadge">0</span>
            </button>
            <button class="filter-tab" data-filter="pending" onclick="filterMessages('pending')">
                <i class="bi bi-clock-history"></i>
                待审核
                <span class="badge" id="pendingBadge">0</span>
            </button>
            <button class="filter-tab" data-filter="approved" onclick="filterMessages('approved')">
                <i class="bi bi-check2-circle"></i>
                已通过
                <span class="badge" id="approvedBadge">0</span>
            </button>
        </div>

        <!-- Messages List -->
        <div class="messages-list" id="messagesList">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>加载中...</p>
            </div>
        </div>
    </div>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://hjrfufuyivgddqpzdrzp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqcmZ1ZnV5aXZnZGRxcHpkcnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MDU3NTAsImV4cCI6MjA3OTk4MTc1MH0.EyFBzpiBuOy9Cm9nwNB-_c7j77Ny8E1F13ltB3BXojs';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allMessages = [];
        let currentFilter = 'all';

        // 检查登录状态
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return null;
            }
            return session;
        }

        // 初始化页面
        async function init() {
            const session = await checkAuth();
            if (!session) return;

            // 显示用户邮箱
            document.getElementById('userEmail').textContent = session.user.email;

            // 加载留言和访问统计
            await Promise.all([loadMessages(), loadVisitStats()]);

            // 每 5 分钟 (300,000 毫秒) 自动刷新一次访问统计
            setInterval(loadVisitStats, 5 * 60 * 1000);
        }

        // 加载访问统计
        async function loadVisitStats() {
            try {
                const { data, error } = await supabaseClient
                    .from('visit_counts')
                    .select('total_visits, last_visit_time')
                    .single();

                if (error) throw error;

                if (data) {
                    // 显示访问次数
                    document.getElementById('visitCount').textContent = data.total_visits || 0;

                    // 格式化并显示最后访问时间
                    if (data.last_visit_time) {
                        document.getElementById('lastVisitTime').textContent = formatBeijingTime(data.last_visit_time);
                    }
                }
            } catch (error) {
                console.error('加载访问统计失败:', error);
            }
        }

        // 格式化为北京时间辅助函数
        function formatBeijingTime(dateInput) {
            if (!dateInput) return '--';
            const date = new Date(dateInput);
            const formatter = new Intl.DateTimeFormat('zh-CN', {
                timeZone: 'UTC',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            const parts = formatter.formatToParts(date);
            const map = new Map(parts.map(p => [p.type, p.value]));
            return `${map.get('year')}-${map.get('month')}-${map.get('day')} ${map.get('hour')}:${map.get('minute')}:${map.get('second')}`;
        }

        // 加载留言
        async function loadMessages() {
            try {
                const { data, error } = await supabaseClient
                    .from('messages')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allMessages = data || [];
                updateStats();
                renderMessages();

            } catch (error) {
                console.error('加载留言失败:', error);
                showToast('加载留言失败', 'error');
            }
        }

        // 更新统计数据
        function updateStats() {
            const total = allMessages.length;
            const pending = allMessages.filter(m => !m.is_approved).length;
            const approved = allMessages.filter(m => m.is_approved).length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('approvedCount').textContent = approved;

            document.getElementById('allBadge').textContent = total;
            document.getElementById('pendingBadge').textContent = pending;
            document.getElementById('approvedBadge').textContent = approved;
        }

        // 过滤留言
        function filterMessages(filter) {
            currentFilter = filter;

            // 更新标签状态
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });

            renderMessages();
        }

        // 渲染留言列表
        function renderMessages() {
            const container = document.getElementById('messagesList');
            
            let filteredMessages = allMessages;
            if (currentFilter === 'pending') {
                filteredMessages = allMessages.filter(m => !m.is_approved);
            } else if (currentFilter === 'approved') {
                filteredMessages = allMessages.filter(m => m.is_approved);
            }

            if (filteredMessages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>暂无留言</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredMessages.map(msg => {
                const formattedDate = formatBeijingTime(msg.created_at);

                const statusClass = msg.is_approved ? 'approved' : 'pending';
                const statusText = msg.is_approved ? '已通过' : '待审核';
                const statusIcon = msg.is_approved ? 'check-circle' : 'hourglass-split';

                return `
                    <div class="message-card ${statusClass}" data-id="${msg.id}">
                        <div class="message-header">
                            <div class="message-user">
                                <div class="user-avatar">${escapeHtml(msg.username.charAt(0).toUpperCase())}</div>
                                <div class="user-details">
                                    <h4>${escapeHtml(msg.username)}</h4>
                                    <div class="meta">
                                        <span><i class="bi bi-clock"></i> ${formattedDate}</span>
                                        ${msg.email ? `<span><i class="bi bi-envelope"></i> ${escapeHtml(msg.email)}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="status-badge ${statusClass}">
                                <i class="bi bi-${statusIcon}"></i>
                                ${statusText}
                            </div>
                        </div>
                        <div class="message-content">${escapeHtml(msg.content)}</div>
                        <div class="message-actions">
                            ${!msg.is_approved ? `
                                <button class="action-btn approve" onclick="approveMessage(${msg.id})">
                                    <i class="bi bi-check-lg"></i>
                                    通过审核
                                </button>
                            ` : `
                                <button class="action-btn reject" onclick="rejectMessage(${msg.id})">
                                    <i class="bi bi-x-lg"></i>
                                    取消通过
                                </button>
                            `}
                            <button class="action-btn delete" onclick="deleteMessage(${msg.id})">
                                <i class="bi bi-trash"></i>
                                删除
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 通过审核
        async function approveMessage(id) {
            try {
                const { error } = await supabaseClient
                    .from('messages')
                    .update({ is_approved: true })
                    .eq('id', id);

                if (error) throw error;

                // 更新本地数据
                const msg = allMessages.find(m => m.id === id);
                if (msg) msg.is_approved = true;

                updateStats();
                renderMessages();
                showToast('留言已通过审核', 'success');

            } catch (error) {
                console.error('操作失败:', error);
                showToast('操作失败', 'error');
            }
        }

        // 取消通过
        async function rejectMessage(id) {
            try {
                const { error } = await supabaseClient
                    .from('messages')
                    .update({ is_approved: false })
                    .eq('id', id);

                if (error) throw error;

                // 更新本地数据
                const msg = allMessages.find(m => m.id === id);
                if (msg) msg.is_approved = false;

                updateStats();
                renderMessages();
                showToast('已取消通过', 'success');

            } catch (error) {
                console.error('操作失败:', error);
                showToast('操作失败', 'error');
            }
        }

        // 删除留言
        async function deleteMessage(id) {
            if (!confirm('确定要删除这条留言吗？此操作不可撤销。')) {
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('messages')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                // 从本地数据中移除
                allMessages = allMessages.filter(m => m.id !== id);

                updateStats();
                renderMessages();
                showToast('留言已删除', 'success');

            } catch (error) {
                console.error('删除失败:', error);
                showToast('删除失败', 'error');
            }
        }

        // 退出登录
        async function handleLogout() {
            try {
                await supabaseClient.auth.signOut();
                window.location.href = 'login.html';
            } catch (error) {
                console.error('退出登录失败:', error);
            }
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 显示 Toast 提示
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 页面加载时初始化
        init();
    </script>
</body>
</html>
