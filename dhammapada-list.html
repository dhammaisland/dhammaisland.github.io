<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法句管理 | 法洲</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --dharma-brown: #8d5a2a;
            --dharma-light: #a67c52;
            --dharma-bg: #fdfbf7;
            --success-color: #059669;
            --danger-color: #dc2626;
            --warning-color: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--dharma-bg);
            min-height: 100vh;
            color: #1f2937;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--dharma-brown) 0%, var(--dharma-light) 100%);
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(141, 90, 42, 0.2);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left i {
            font-size: 28px;
        }

        .header-left h1 {
            font-size: 20px;
            font-weight: 500;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            font-size: 14px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .add-btn {
            background: white;
            color: var(--dharma-brown);
            font-weight: 500;
        }

        .add-btn:hover {
            background: #f5f5f5;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(141, 90, 42, 0.1);
            color: var(--dharma-brown);
        }

        .stat-content h3 {
            font-size: 28px;
            font-weight: 600;
            color: #1f2937;
        }

        .stat-content p {
            font-size: 14px;
            color: #6b7280;
            margin-top: 4px;
        }

        /* Search Bar */
        .search-bar {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: white;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--dharma-brown);
            box-shadow: 0 0 0 4px rgba(141, 90, 42, 0.1);
        }

        /* List */
        .dhammapada-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dhammapada-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            border-left: 4px solid var(--dharma-brown);
        }

        .dhammapada-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .dhammapada-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 16px;
        }

        .dhammapada-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #9ca3af;
            font-size: 13px;
            flex-wrap: wrap;
        }

        .dhammapada-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dhammapada-content {
            font-size: 15px;
            line-height: 1.8;
            color: #374151;
            padding: 16px;
            background: #f9fafb;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .dhammapada-content img {
            max-width: 100%;
            border-radius: 8px;
        }

        .dhammapada-url {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--dharma-brown);
            font-size: 13px;
            margin-bottom: 16px;
            word-break: break-all;
        }

        .dhammapada-url a {
            color: var(--dharma-brown);
            text-decoration: none;
        }

        .dhammapada-url a:hover {
            text-decoration: underline;
        }

        .dhammapada-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
            text-decoration: none;
        }

        .action-btn.edit {
            background: rgba(141, 90, 42, 0.1);
            color: var(--dharma-brown);
        }

        .action-btn.edit:hover {
            background: rgba(141, 90, 42, 0.2);
        }

        .action-btn.delete {
            background: #fef2f2;
            color: var(--danger-color);
            border: 1px solid #fecaca;
        }

        .action-btn.delete:hover {
            background: #fee2e2;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #9ca3af;
            background: white;
            border-radius: 16px;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 24px;
        }

        .empty-state .action-btn {
            display: inline-flex;
            background: var(--dharma-brown);
            color: white;
        }

        .empty-state .action-btn:hover {
            background: var(--dharma-light);
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #e5e7eb;
            border-top-color: var(--dharma-brown);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1f2937;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: var(--success-color);
        }

        .toast.error {
            background: var(--danger-color);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
        }

        .pagination-btn {
            padding: 10px 20px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--dharma-brown);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pagination-btn:hover:not(:disabled) {
            border-color: var(--dharma-brown);
            background: rgba(141, 90, 42, 0.05);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            font-size: 14px;
            color: #6b7280;
        }

        /* Confirm Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal i.warning {
            font-size: 48px;
            color: var(--danger-color);
            margin-bottom: 16px;
        }

        .modal h3 {
            font-size: 18px;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .modal p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .modal-btn.cancel {
            background: #f3f4f6;
            color: #6b7280;
        }

        .modal-btn.cancel:hover {
            background: #e5e7eb;
        }

        .modal-btn.confirm {
            background: var(--danger-color);
            color: white;
        }

        .modal-btn.confirm:hover {
            background: #b91c1c;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .header-right {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .container {
                padding: 16px;
            }

            .dhammapada-header {
                flex-direction: column;
            }

            .dhammapada-actions {
                width: 100%;
            }

            .action-btn {
                flex: 1;
                justify-content: center;
            }
        }

        /* Dark Theme */
        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a1a;
                color: #e5e7eb;
            }

            .stat-card, .dhammapada-card, .empty-state {
                background: #2a2a2a;
            }

            .stat-content h3 {
                color: #e5e7eb;
            }

            .search-input {
                background: #2a2a2a;
                border-color: #404040;
                color: #e5e7eb;
            }

            .dhammapada-content {
                background: #1f1f1f;
                color: #d1d5db;
            }

            .pagination-btn {
                background: #2a2a2a;
                border-color: #404040;
                color: #e5e7eb;
            }

            .modal {
                background: #2a2a2a;
            }

            .modal h3 {
                color: #e5e7eb;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <i class="bi bi-flower1"></i>
            <h1>法句管理</h1>
        </div>
        <div class="header-right">
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span id="userEmail">管理员</span>
            </div>
            <a href="dhammapada-edit.html" class="header-btn add-btn">
                <i class="bi bi-plus-lg"></i>
                <span>添加法句</span>
            </a>
            <a href="index.html" class="header-btn">
                <i class="bi bi-house"></i>
                <span>首页</span>
            </a>
            <button class="header-btn" onclick="handleLogout()">
                <i class="bi bi-box-arrow-right"></i>
                <span>退出</span>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="bi bi-journal-text"></i>
                </div>
                <div class="stat-content">
                    <h3 id="totalCount">0</h3>
                    <p>法句总数</p>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <div class="search-input-wrapper">
                <i class="bi bi-search"></i>
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="搜索法句内容..."
                    oninput="debounceSearch()"
                >
            </div>
        </div>

        <!-- List -->
        <div class="dhammapada-list" id="dhammapadaList">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>加载中...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination" style="display: none;">
            <button class="pagination-btn" id="prevBtn" onclick="prevPage()">
                <i class="bi bi-chevron-left"></i>
                上一页
            </button>
            <span class="pagination-info" id="pageInfo">第 1 页 / 共 1 页</span>
            <button class="pagination-btn" id="nextBtn" onclick="nextPage()">
                下一页
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <i class="bi bi-exclamation-triangle-fill warning"></i>
            <h3>确认删除</h3>
            <p>确定要删除这条法句吗？此操作不可撤销。</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeDeleteModal()">取消</button>
                <button class="modal-btn confirm" id="confirmDeleteBtn" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://hjrfufuyivgddqpzdrzp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqcmZ1ZnV5aXZnZGRxcHpkcnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MDU3NTAsImV4cCI6MjA3OTk4MTc1MH0.EyFBzpiBuOy9Cm9nwNB-_c7j77Ny8E1F13ltB3BXojs';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 状态
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 10;
        let deleteId = null;
        let searchTimeout = null;

        // 检查登录状态
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return null;
            }
            return session;
        }

        // 初始化
        async function init() {
            const session = await checkAuth();
            if (!session) return;

            document.getElementById('userEmail').textContent = session.user.email;
            await loadData();
        }

        // 加载数据
        async function loadData() {
            try {
                const { data, error } = await supabaseClient
                    .from('dhammapada')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allData = data || [];
                filteredData = [...allData];
                updateStats();
                renderList();

            } catch (error) {
                console.error('加载数据失败:', error);
                showToast('加载数据失败', 'error');
            }
        }

        // 更新统计
        function updateStats() {
            document.getElementById('totalCount').textContent = allData.length;
        }

        // 搜索防抖
        function debounceSearch() {
            if (searchTimeout) clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                search();
            }, 300);
        }

        // 搜索
        function search() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!keyword) {
                filteredData = [...allData];
            } else {
                filteredData = allData.filter(item => {
                    const sentence = (item.sentence || '').toLowerCase();
                    const url = (item.url || '').toLowerCase();
                    return sentence.includes(keyword) || url.includes(keyword);
                });
            }
            
            currentPage = 1;
            renderList();
        }

        // 渲染列表
        function renderList() {
            const container = document.getElementById('dhammapadaList');
            const paginationEl = document.getElementById('pagination');
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-journal-x"></i>
                        <p>暂无法句数据</p>
                        <a href="dhammapada-edit.html" class="action-btn">
                            <i class="bi bi-plus-lg"></i>
                            添加第一条法句
                        </a>
                    </div>
                `;
                paginationEl.style.display = 'none';
                return;
            }

            // 分页
            const totalPages = Math.ceil(filteredData.length / pageSize);
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const pageData = filteredData.slice(startIndex, endIndex);

            container.innerHTML = pageData.map(item => {
                const createdAt = new Date(item.created_at);
                const updatedAt = new Date(item.updated_at);
                const formattedCreated = createdAt.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                const formattedUpdated = updatedAt.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                return `
                    <div class="dhammapada-card" data-id="${item.id}">
                        <div class="dhammapada-header">
                            <div class="dhammapada-meta">
                                <span><i class="bi bi-calendar-plus"></i> 创建: ${formattedCreated}</span>
                                <span><i class="bi bi-calendar-check"></i> 更新: ${formattedUpdated}</span>
                            </div>
                        </div>
                        <div class="dhammapada-content">${item.sentence || ''}</div>
                        ${item.url ? `
                            <div class="dhammapada-url">
                                <i class="bi bi-link-45deg"></i>
                                <a href="${escapeHtml(item.url)}" target="_blank">${escapeHtml(item.url)}</a>
                            </div>
                        ` : ''}
                        <div class="dhammapada-actions">
                            <a href="dhammapada-edit.html?id=${item.id}" class="action-btn edit">
                                <i class="bi bi-pencil"></i>
                                编辑
                            </a>
                            <button class="action-btn delete" onclick="showDeleteModal('${item.id}')">
                                <i class="bi bi-trash"></i>
                                删除
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // 更新分页
            if (totalPages > 1) {
                paginationEl.style.display = 'flex';
                document.getElementById('pageInfo').textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
                document.getElementById('prevBtn').disabled = currentPage <= 1;
                document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            } else {
                paginationEl.style.display = 'none';
            }
        }

        // 分页
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderList();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderList();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // 删除确认
        function showDeleteModal(id) {
            deleteId = id;
            document.getElementById('deleteModal').classList.add('show');
        }

        function closeDeleteModal() {
            deleteId = null;
            document.getElementById('deleteModal').classList.remove('show');
        }

        async function confirmDelete() {
            if (!deleteId) return;

            try {
                const { error } = await supabaseClient
                    .from('dhammapada')
                    .delete()
                    .eq('id', deleteId);

                if (error) throw error;

                // 从本地数据中移除
                allData = allData.filter(item => item.id !== deleteId);
                filteredData = filteredData.filter(item => item.id !== deleteId);
                
                closeDeleteModal();
                updateStats();
                renderList();
                showToast('删除成功', 'success');

            } catch (error) {
                console.error('删除失败:', error);
                showToast('删除失败', 'error');
            }
        }

        // 退出登录
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        // 工具函数
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="bi bi-${type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);

            setTimeout(() => toast.remove(), 3000);
        }

        // 初始化页面
        init();
    </script>
</body>
</html>
